<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Cream2Go cashier workspace.">
	<meta name="theme-color" content="#121316">
	<title>Cashier | Cream2Go</title>
	<link rel="stylesheet" href="CSS/style.css">
	<link rel="stylesheet" href="CSS/auth.css">
	<script src="Javascript/auth.js" defer></script>
</head>
<body class="auth-page">
	<main class="cashier-layout" data-cashier-page>
		<header class="cashier-header">
			<a class="auth-brand" href="/" aria-label="Cream2Go home"><img src="assets/BG_Removed_20260923_102618.png" alt="Cream2Go"></a>
			<button class="auth-logout" type="button" data-logout>Sign out</button>
		</header>
		<section class="cashier-welcome" aria-labelledby="cashier-welcome-title">
			<p class="auth-eyebrow">CASHIER WORKSPACE</p>
			<h1 id="cashier-welcome-title">Good day, <span data-user-name>team member</span>.</h1>
			<p>You are signed in to the Cream2Go cashier account.</p>
			<div class="cashier-status"><span aria-hidden="true"></span> Secure session active</div>
		</section>
		<footer class="auth-footer">CREAM2GO <span>·</span> STAFF PORTAL</footer>
	</main>
</body>
</html>
